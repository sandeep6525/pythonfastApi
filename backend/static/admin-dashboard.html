<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #111827;
        }

        .header {
            background: #111827;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        .container {
            padding: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card h3 {
            margin-top: 0;
            color: #555;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
            margin-top: 10px;
        }

        .section {
            background: white;
            margin-top: 30px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-header h2 {
            margin: 0;
        }

        .refresh-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .refresh-btn:hover {
            background: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f3f4f6;
        }

        tr:hover {
            background: #f9fafb;
        }

        .status-active {
            color: #16a34a;
            font-weight: bold;
        }

        .status-inactive {
            color: #dc2626;
            font-weight: bold;
        }

        .role {
            padding: 5px 9px;
            border-radius: 5px;
            background: #e5e7eb;
            display: inline-block;
            font-size: 13px;
        }

        .error-message {
            display: none;
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        @media (max-width: 900px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 15px;
            }

            .header {
                padding: 15px;
            }

            table {
                font-size: 13px;
            }
        }

        .status-button {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }

        .status-button:hover {
            background: #1d4ed8;
        }

        .active-status {
            color: #16a34a;
            font-weight: 600;
        }

        .inactive-status {
            color: #dc2626;
            font-weight: 600;
        }

        .role-badge {
            background: #e5e7eb;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 13px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-header h2 {
            margin: 0;
        }

        .refresh-button {
            width: auto;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        .refresh-button:hover {
            background: #1d4ed8;
        }

        .filters {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .filters input,
        .filters select {
            margin-bottom: 0;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            background: white;
        }

        .filters input:focus,
        .filters select:focus {
            outline: none;
            border-color: #2563eb;
        }

        @media (max-width: 768px) {

            .filters {
                grid-template-columns: 1fr;
            }

        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-header h2 {
            margin: 0;
        }

        .refresh-button {
            width: auto;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        .refresh-button:hover {
            background: #1d4ed8;
        }

        .filters {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .filters input,
        .filters select {
            margin-bottom: 0;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            background: white;
        }

        .filters input:focus,
        .filters select:focus {
            outline: none;
            border-color: #2563eb;
        }

        @media (max-width: 768px) {

            .filters {
                grid-template-columns: 1fr;
            }

        }
    </style>

</head>

<body>

    <!-- =========================
     HEADER
========================= -->

    <div class="header">

        <h1>Admin Dashboard</h1>

        <div class="header-right">
            <span id="adminName">Administrator</span>

            <button class="logout-btn" onclick="logout()">
                Logout
            </button>
        </div>

    </div>


    <!-- =========================
     MAIN CONTENT
========================= -->

    <div class="container">


        <div id="errorMessage" class="error-message"></div>

    </div>
    
        <!-- =========================
         STATISTICS
    ========================== -->

        <div class="cards">

            <div class="card">
                <h3>Total Users</h3>
                <div class="number" id="totalUsers">0</div>
            </div>

            <div class="card">
                <h3>Active Users</h3>
                <div class="number" id="activeUsers">0</div>
            </div>

            <div class="card">
                <h3>Administrators</h3>
                <div class="number" id="adminUsers">0</div>
            </div>

            <div class="card">
                <h3>Recruiters</h3>
                <div class="number" id="recruiterUsers">0</div>
            </div>

        </div>


        <!-- =========================
         USER MANAGEMENT
    ========================== -->

        <div class="section">

            <div class="section-header">

                <h2>User Management</h2>

                <button onclick="loadDashboard()" class="refresh-button">
                    Refresh
                </button>

            </div>


            <!-- FILTERS -->

            <div class="filters">

                <!-- SEARCH -->

                <input type="text" id="searchInput" placeholder="Search name or email..." oninput="filterUsers()">


                <!-- ROLE FILTER -->

                <select id="roleFilter" onchange="filterUsers()">

                    <option value="all">
                        All Roles
                    </option>

                    <option value="administrator">
                        Administrator
                    </option>

                    <option value="admin">
                        Admin
                    </option>

                    <option value="recruiter">
                        Recruiter
                    </option>

                    <option value="user">
                        User
                    </option>

                </select>


                <!-- STATUS FILTER -->

                <select id="statusFilter" onchange="filterUsers()">

                    <option value="all">
                        All Status
                    </option>

                    <option value="active">
                        Active
                    </option>

                    <option value="inactive">
                        Inactive
                    </option>

                </select>

            </div>


            <!-- USER TABLE -->

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Name</th>

                        <th>Email</th>

                        <th>Role</th>

                        <th>Status</th>

                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="usersTable">

                </tbody>

            </table>

        </div>


        <script>

            /* =====================================================
               GET TOKEN
            ===================================================== */

            function getToken() {

                return localStorage.getItem("access_token");

            }


            /* =====================================================
               AUTH HEADERS
            ===================================================== */

            function getAuthHeaders() {

                const token = getToken();

                return {
                    "Accept": "application/json",
                    "Authorization": "Bearer " + token
                };

            }


            /* =====================================================
               LOAD ADMIN DASHBOARD
            ===================================================== */
            async function loadDashboard() {

                const token = getToken();

                if (!token) {
                    window.location.href = "/login";
                    return;
                }

                hideError();

                try {

                    /*
                     * ==============================================
                     * 1. GET ADMIN STATISTICS
                     * ==============================================
                     */

                    const statsResponse = await fetch(
                        "/api/admin/stats",
                        {
                            method: "GET",
                            headers: getAuthHeaders()
                        }
                    );

                    if (statsResponse.status === 401) {
                        logout();
                        return;
                    }

                    if (statsResponse.status === 403) {

                        showError(
                            "Administrator access required."
                        );

                        return;
                    }

                    if (!statsResponse.ok) {

                        throw new Error(
                            "Failed to load admin statistics"
                        );
                    }

                    const stats =
                        await statsResponse.json();


                    /*
                     * ==============================================
                     * UPDATE STATISTICS CARDS
                     * ==============================================
                     */

                    document.getElementById("totalUsers").textContent =
                        stats.total_users ?? 0;

                    document.getElementById("activeUsers").textContent =
                        stats.active_users ?? 0;

                    document.getElementById("adminUsers").textContent =
                        stats.administrators ?? 0;

                    document.getElementById("recruiterUsers").textContent =
                        stats.recruiters ?? 0;


                    /*
                     * ==============================================
                     * 2. GET ALL USERS
                     * ==============================================
                     */

                    const usersResponse = await fetch(
                        "/api/admin/users",
                        {
                            method: "GET",
                            headers: getAuthHeaders()
                        }
                    );

                    if (usersResponse.status === 401) {
                        logout();
                        return;
                    }

                    if (usersResponse.status === 403) {

                        showError(
                            "Administrator access required."
                        );

                        return;
                    }

                    if (!usersResponse.ok) {

                        throw new Error(
                            "Failed to load users"
                        );
                    }

                    const data =
                        await usersResponse.json();


                    /*
                     * ==============================================
                     * SAVE USERS
                     * ==============================================
                     */

                    allUsers = data.users || [];


                    /*
                     * ==============================================
                     * DISPLAY USERS
                     * ==============================================
                     */

                    displayUsers(allUsers);

                }

                catch (error) {

                    console.error(
                        "Dashboard error:",
                        error
                    );

                    showError(
                        "Unable to load dashboard data. Please try again."
                    );
                }
            }




            function displayUsers(users) {

                const table =
                    document.getElementById("usersTable");

                table.innerHTML = "";


                /*
                 * CURRENT LOGGED-IN USER
                 */

                const currentUser =
                    JSON.parse(
                        localStorage.getItem("user") || "null"
                    );


                /*
                 * NO USERS
                 */

                if (users.length === 0) {

                    table.innerHTML = `
            <tr>
                <td colspan="6"
                    style="text-align:center; padding:25px;">
                    No users found
                </td>
            </tr>
        `;

                    return;
                }


                /*
                 * DISPLAY USERS
                 */

                users.forEach(user => {

                    const row =
                        document.createElement("tr");


                    const isCurrentUser =
                        currentUser &&
                        Number(user.id) === Number(currentUser.id);


                    row.innerHTML = `

            <td>
                ${escapeHtml(user.id)}
            </td>

            <td>
                ${escapeHtml(user.name)}
            </td>

            <td>
                ${escapeHtml(user.email)}
            </td>

            <td>
                <span class="role-badge">
                    ${escapeHtml(user.role)}
                </span>
            </td>

            <td>

                <span class="${user.is_active
                            ? "active-status"
                            : "inactive-status"
                        }">

                    ${user.is_active
                            ? "Active"
                            : "Inactive"
                        }

                </span>

            </td>

            <td>

                ${isCurrentUser

                            ?

                            `<span>Current User</span>`

                            :

                            `
                    <button
                        class="status-button"
                        onclick="changeUserStatus(${user.id})"
                    >
                        ${user.is_active
                                ? "Deactivate"
                                : "Activate"
                            }
                    </button>
                    `
                        }

            </td>

        `;

                    table.appendChild(row);
                });
            }
            function filterUsers() {

                const searchInput =
                    document.getElementById("searchInput");

                const roleFilter =
                    document.getElementById("roleFilter");

                const statusFilter =
                    document.getElementById("statusFilter");


                const search =
                    searchInput
                        ? searchInput.value.toLowerCase().trim()
                        : "";


                const selectedRole =
                    roleFilter
                        ? roleFilter.value
                        : "all";


                const selectedStatus =
                    statusFilter
                        ? statusFilter.value
                        : "all";


                /*
                 * FILTER USERS
                 */

                const filteredUsers =
                    allUsers.filter(user => {


                        /*
                         * SEARCH
                         */

                        const name =
                            String(user.name || "")
                                .toLowerCase();

                        const email =
                            String(user.email || "")
                                .toLowerCase();


                        const matchesSearch =
                            name.includes(search) ||
                            email.includes(search);


                        /*
                         * ROLE
                         */

                        const matchesRole =
                            selectedRole === "all" ||
                            user.role === selectedRole;


                        /*
                         * STATUS
                         */

                        let matchesStatus = true;


                        if (selectedStatus === "active") {

                            matchesStatus =
                                user.is_active === true;

                        }


                        if (selectedStatus === "inactive") {

                            matchesStatus =
                                user.is_active === false;

                        }


                        return (
                            matchesSearch &&
                            matchesRole &&
                            matchesStatus
                        );

                    });


                /*
                 * DISPLAY FILTERED USERS
                 */

                displayUsers(filteredUsers);
            }


            /* =====================================================
               ESCAPE HTML
            ===================================================== */

            function escapeHtml(value) {

                if (value === null || value === undefined) {

                    return "";

                }

                return String(value)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");

            }


            /* =====================================================
               ERROR MESSAGE
            ===================================================== */

            function showError(message) {

                const error =
                    document.getElementById("errorMessage");

                error.textContent = message;

                error.style.display = "block";

            }


            function hideError() {

                const error =
                    document.getElementById("errorMessage");

                error.style.display = "none";

            }


            /* =====================================================
               LOGOUT
            ===================================================== */

            function logout() {

                localStorage.removeItem("access_token");

                window.location.href = "/login";

            }


            /* =====================================================
               START DASHBOARD
            ===================================================== */
            let allUsers = [];
            loadDashboard();


            async function changeUserStatus(userId) {

                const token = localStorage.getItem("access_token");

                if (!token) {
                    window.location.href = "/login";
                    return;
                }

                try {

                    const response = await fetch(
                        `/api/admin/users/${userId}/status`,
                        {
                            method: "PUT",
                            headers: {
                                "Authorization": "Bearer " + token
                            }
                        }
                    );

                    const data = await response.json();

                    if (!response.ok) {

                        alert(data.detail || "Unable to change user status");

                        return;
                    }

                    alert(data.message);

                    // Reload dashboard
                    loadDashboard();

                }
                catch (error) {

                    console.error(error);

                    alert("Unable to connect to server");
                }
            }


        </script>

</body>

</html>
